name: Publish Panel to GHCR

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "app/**"
      - ".github/workflows/publish-panel-ghcr.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Panel image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nickli-bott/mihomo-panel:latest
            ghcr.io/nickli-bott/mihomo-panel:sha-${{ github.sha }}
