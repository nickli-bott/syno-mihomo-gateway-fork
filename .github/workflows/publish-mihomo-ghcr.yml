name: Publish Mihomo to GHCR

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull upstream Mihomo image for Synology amd64
        run: docker pull --platform linux/amd64 metacubex/mihomo:latest

      - name: Tag and push to this account's GHCR
        run: |
          docker tag metacubex/mihomo:latest ghcr.io/nickli-bott/mihomo:latest
          docker tag metacubex/mihomo:latest ghcr.io/nickli-bott/mihomo:sha-${GITHUB_SHA::12}
          docker push ghcr.io/nickli-bott/mihomo:latest
          docker push ghcr.io/nickli-bott/mihomo:sha-${GITHUB_SHA::12}
